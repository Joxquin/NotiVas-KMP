<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>NotiVas Bridge - Test Suite</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 680px;
      margin: 40px auto;
      padding: 24px;
      background: #121214;
      color: #e4e4e7;
      border-radius: 12px;
    }
    h1 { font-size: 1.4rem; color: #a1a1aa; margin-top: 0; }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: bold;
      background: #27272a;
      color: #f43f5e;
    }
    .badge.ready {
      background: #14532d;
      color: #4ade80;
    }
    input, button {
      display: block;
      width: 100%;
      padding: 10px 14px;
      margin-top: 12px;
      border-radius: 8px;
      border: 1px solid #3f3f46;
      background: #18181b;
      color: #fff;
      box-sizing: border-box;
      font-size: 0.95rem;
    }
    button {
      background: #3b82f6;
      border-color: #3b82f6;
      cursor: pointer;
      font-weight: 600;
      margin-top: 16px;
    }
    button:hover { background: #2563eb; }
    pre {
      background: #09090b;
      padding: 16px;
      border-radius: 8px;
      border: 1px solid #27272a;
      overflow-x: auto;
      font-size: 0.85rem;
      max-height: 380px;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <h1>NotiVas Bridge - Prueba de Desarrollador</h1>
  
  <div>
    Estado de la extensión: 
    <span id="bridge-status" class="badge">No detectada</span>
  </div>

  <label style="display:block; margin-top:20px; font-size:0.9rem; color:#a1a1aa;">
    Dominio de tu Canvas LMS:
    <input id="domain-input" type="text" value="tecsup.instructure.com" placeholder="ej. tecsup.instructure.com" />
  </label>

  <button id="btn-fetch" onclick="solicitarCookies()">Probar extracción de cookies</button>

  <h3>Resultado:</h3>
  <pre id="output">Esperando solicitud...</pre>

  <script>
    const statusEl = document.getElementById('bridge-status');
    const outputEl = document.getElementById('output');

    window.addEventListener('message', (event) => {
      if (event.data && event.data.type === 'NOTIVAS_BRIDGE_AVAILABLE') {
        statusEl.textContent = 'Activa y Conectada (v' + event.data.version + ')';
        statusEl.className = 'badge ready';
      }

      if (event.data && event.data.type === 'NOTIVAS_RESPONSE_SESSION') {
        outputEl.textContent = JSON.stringify(event.data.payload, null, 2);
      }
    });

    function solicitarCookies() {
      const domain = document.getElementById('domain-input').value.trim();
      outputEl.textContent = 'Enviando petición a la extensión para ' + domain + '...';
      window.postMessage({
        type: 'NOTIVAS_REQUEST_SESSION',
        domain: domain,
        requestId: Date.now()
      }, '*');
    }

    // Ping al inicio para despertar el puente
    window.postMessage({ type: 'NOTIVAS_PING' }, '*');
    setInterval(() => {
      if (statusEl.className.indexOf('ready') === -1) {
        window.postMessage({ type: 'NOTIVAS_PING' }, '*');
      }
    }, 1000);
  </script>
</body>
</html>

name: CI Multiplatform Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android Debug APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: notivas-android-debug
          path: androidApp/build/outputs/apk/debug/*.apk

  build-ios:
    name: Build iOS App
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Select Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Build iOS App (Simulator build)
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build/ios_derived \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Compress iOS App
        run: |
          cd build/ios_derived/Build/Products/Debug-iphonesimulator
          zip -r -y NotiVas-iOS-Simulator.app.zip *.app

      - name: Upload iOS App
        uses: actions/upload-artifact@v4
        with:
          name: notivas-ios-simulator-app
          path: build/ios_derived/Build/Products/Debug-iphonesimulator/NotiVas-iOS-Simulator.app.zip

name: Automated Release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Tipo de versión (patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android Release APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: notivas-android-apk
          path: androidApp/build/outputs/apk/debug/*.apk

  build-ios:
    name: Build iOS App
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Select Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Build iOS App (Simulator build)
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build/ios_derived \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Compress iOS App
        run: |
          cd build/ios_derived/Build/Products/Debug-iphonesimulator
          zip -r -y NotiVas-iOS-Simulator.app.zip *.app

      - name: Upload iOS App
        uses: actions/upload-artifact@v4
        with:
          name: notivas-ios-app
          path: build/ios_derived/Build/Products/Debug-iphonesimulator/NotiVas-iOS-Simulator.app.zip

  publish-release:
    name: Publish Release with AI Notes
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: ${{ github.event.inputs.bump_type || 'patch' }}

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: notivas-android-apk
          path: release_artifacts/android

      - name: Download iOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: notivas-ios-app
          path: release_artifacts/ios

      - name: Collect Git Log
        id: git_log
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log -n 25 --pretty=format:"- %s (%h)")
          else
            COMMITS=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)")
          fi
          echo "COMMITS<<EOF" >> $GITHUB_ENV
          echo "$COMMITS" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Generate AI Changelog via Gemini
        id: ai_notes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          PROMPT="Eres el Release Manager de NotiVas-KMP. Redacta notas de versión atractivas, concisas y profesionales en español (Markdown) para la versión ${{ steps.tag_version.outputs.new_tag }}.
          Organiza el contenido en secciones claras:
          - Resumen destacado
          - Novedades y Características
          - Mejoras y Optimización
          - Correcciones
          
          Lista de cambios y commits recientes:
          $COMMITS"

          PAYLOAD=$(jq -n --arg prompt "$PROMPT" '{contents: [{parts: [{text: $prompt}]}]}')

          RESPONSE=$(curl -s -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}" \
            -H 'Content-Type: application/json' \
            -d "$PAYLOAD")

          AI_TEXT=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty')

          if [ -z "$AI_TEXT" ]; then
            AI_TEXT="## NotiVas ${{ steps.tag_version.outputs.new_tag }}\n\n### Cambios recientes:\n$COMMITS"
          fi

          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          echo "$AI_TEXT" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: NotiVas ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ env.CHANGELOG }}
          files: |
            release_artifacts/android/*.apk
            release_artifacts/ios/*.zip

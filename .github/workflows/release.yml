name: Automated Release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Tipo de versión (patch, minor, major)'
        required: true
        default: 'minor'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Prepare, Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Calculate next tag
        id: next_tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: ${{ github.event.inputs.bump_type || 'minor' }}
          dry_run: true

      - name: Collect Git Log
        id: git_log
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log -n 50 --pretty=format:"- %s (%h)")
          else
            COMMITS=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)")
          fi
          echo "COMMITS<<EOF" >> $GITHUB_ENV
          echo "$COMMITS" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Generate AI Changelog via Gemini
        id: ai_notes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          PROMPT="You are the release manager of 'NotiVas - KMP'. Write clean, professional release notes in English following strictly this exact Markdown format:

          ### New Features

          • Feature Title: Concise description of the user-facing feature.
          • Another Feature: Description.

          ### Bug Fixes & Performance

          • Fix Title: Description of the fix or optimization.

          Rules:
          - Use bullet symbol '• ' (not '-').
          - Use bold title followed by colon, like: '• Title: Description'.
          - Do not include commit hashes, markdown code blocks, backticks, or greetings.
          - Categorize items clearly under '### New Features' or '### Bug Fixes & Performance'.

          List of recent commits:
          $COMMITS"

          PAYLOAD=$(jq -n --arg prompt "$PROMPT" '{contents: [{parts: [{text: $prompt}]}]}')

          RESPONSE=$(curl -s -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent?key=${GEMINI_API_KEY}" \
            -H 'Content-Type: application/json' \
            -d "$PAYLOAD")

          AI_TEXT=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty')

          if [ -z "$AI_TEXT" ]; then
            AI_TEXT="### New Features\n\n• Performance and UI Improvements: Updated components and optimized multiplatform sync."
          fi

          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          echo "$AI_TEXT" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Update Gradle Version and update.json
        id: bump_metadata
        run: |
          python3 - << 'EOF'
          import json, re, os

          new_tag = "${{ steps.next_tag.outputs.new_tag }}"
          new_version = "${{ steps.next_tag.outputs.new_version }}"
          changelog = os.environ.get("CHANGELOG", "")

          gradle_path = "androidApp/build.gradle.kts"
          with open(gradle_path, "r", encoding="utf-8") as f:
              gradle_code = f.read()

          vc_match = re.search(r"versionCode\s*=\s*(\d+)", gradle_code)
          current_vc = int(vc_match.group(1)) if vc_match else 1
          next_vc = current_vc + 1

          gradle_code = re.sub(r"versionCode\s*=\s*\d+", f"versionCode = {next_vc}", gradle_code)
          gradle_code = re.sub(r"versionName\s*=\s*\"[^\"]+\"", f'versionName = "{new_version}"', gradle_code)

          with open(gradle_path, "w", encoding="utf-8") as f:
              f.write(gradle_code)

          # Actualizar update.json
          update_path = "update.json"
          if os.path.exists(update_path):
              with open(update_path, "r", encoding="utf-8") as f:
                  update_data = json.load(f)
              
              update_data["version"] = new_version
              update_data["versionCode"] = next_vc
              update_data["title"] = f"NotiVas v{new_version}"
              
              # Tomar hasta las primeras 4 líneas de bullets para las notas breves de actualización
              bullet_lines = [line.strip() for line in changelog.splitlines() if line.strip().startswith("•")]
              if bullet_lines:
                  update_data["notes"] = "\n".join(bullet_lines[:5])
              
              with open(update_path, "w", encoding="utf-8") as f:
                  json.dump(update_data, f, indent=2, ensure_ascii=False)
                  f.write("\n")

          print(f"Updated {gradle_path} and {update_path} to version {new_version} (versionCode {next_vc})")
          EOF

      - name: Commit version bump and create tag
        run: |
          NEW_TAG="${{ steps.next_tag.outputs.new_tag }}"
          NEW_VERSION="${{ steps.next_tag.outputs.new_version }}"
          git add androidApp/build.gradle.kts update.json
          git commit -m "chore(release): bump version to ${NEW_VERSION} [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > androidApp/release.keystore
            echo "Keystore decoded successfully."
          else
            echo "Warning: RELEASE_KEYSTORE_BASE64 secret not found."
          fi

      - name: Build Android Release APKs
        run: ./gradlew :androidApp:assembleRelease --stacktrace

      - name: Filter arm64 and universal APKs
        run: |
          mkdir -p release_to_upload
          find androidApp/build/outputs/apk/release -name "*universal*.apk" -exec cp {} release_to_upload/androidApp-universal-release.apk \;
          find androidApp/build/outputs/apk/release -name "*arm64-v8a*.apk" -exec cp {} release_to_upload/androidApp-arm64-v8a-release.apk \;
          if [ -z "$(ls -A release_to_upload)" ]; then
            cp androidApp/build/outputs/apk/release/*.apk release_to_upload/
          fi
          ls -la release_to_upload/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.next_tag.outputs.new_tag }}
          name: NotiVas - KMP ${{ steps.next_tag.outputs.new_tag }}
          body: ${{ env.CHANGELOG }}
          files: release_to_upload/*.apk

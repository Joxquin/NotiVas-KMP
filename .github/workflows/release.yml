name: Automated Release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Tipo de versión (patch, minor, major)'
        required: true
        default: 'minor'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    name: Build Signed Android Release APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > androidApp/release.keystore
            echo "Keystore decoded successfully."
          else
            echo "Warning: RELEASE_KEYSTORE_BASE64 secret not found."
          fi

      - name: Build Android Release APKs
        run: ./gradlew :androidApp:assembleRelease --stacktrace

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: notivas-release-apks
          path: androidApp/build/outputs/apk/release/*.apk

  publish-release:
    name: Publish Release with AI Notes
    needs: [build-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: ${{ github.event.inputs.bump_type || 'minor' }}

      - name: Download Release APKs
        uses: actions/download-artifact@v4
        with:
          name: notivas-release-apks
          path: release_apks

      - name: Filter arm64 and universal APKs
        run: |
          mkdir -p release_to_upload
          # Conservar nombres originales oficiales de APK (androidApp-universal-release.apk y androidApp-arm64-v8a-release.apk)
          find release_apks -name "*universal*.apk" -exec cp {} release_to_upload/androidApp-universal-release.apk \;
          find release_apks -name "*arm64-v8a*.apk" -exec cp {} release_to_upload/androidApp-arm64-v8a-release.apk \;
          if [ -z "$(ls -A release_to_upload)" ]; then
            cp release_apks/*.apk release_to_upload/
          fi
          ls -la release_to_upload/

      - name: Collect Git Log
        id: git_log
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log -n 50 --pretty=format:"- %s (%h)")
          else
            COMMITS=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)")
          fi
          echo "COMMITS<<EOF" >> $GITHUB_ENV
          echo "$COMMITS" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Generate AI Changelog via Gemini
        id: ai_notes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          PROMPT="You are the release manager of 'NotiVas - KMP'. Write clean, professional release notes in English following strictly this exact Markdown format:

          ### New Features

          • Feature Title: Concise description of the user-facing feature.
          • Another Feature: Description.

          ### Bug Fixes & Performance

          • Fix Title: Description of the fix or optimization.

          Rules:
          - Use bullet symbol '• ' (not '-').
          - Use bold title followed by colon, like: '• Title: Description'.
          - Do not include commit hashes, markdown code blocks, backticks, or greetings.
          - Categorize items clearly under '### New Features' or '### Bug Fixes & Performance'.

          List of recent commits:
          $COMMITS"

          PAYLOAD=$(jq -n --arg prompt "$PROMPT" '{contents: [{parts: [{text: $prompt}]}]}')

          RESPONSE=$(curl -s -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent?key=${GEMINI_API_KEY}" \
            -H 'Content-Type: application/json' \
            -d "$PAYLOAD")

          AI_TEXT=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty')

          if [ -z "$AI_TEXT" ]; then
            AI_TEXT="### New Features\n\n• Performance and UI Improvements: Updated components and optimized multiplatform sync."
          fi

          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          echo "$AI_TEXT" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: NotiVas - KMP ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ env.CHANGELOG }}
          files: release_to_upload/*.apk
